<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap narrow">
    <section class="panel">
      <p class="eyebrow">One token, several accounts</p>
      <h1>Choose an Instagram account</h1>
      <p class="muted">These accounts were shared in this login. The same token is already saved for each of them.</p>
      <ul class="account-list">
        {% for account in accounts %}
          <li>
            <form method="post" action="{{ url_for('choose_account') }}">
              <input type="hidden" name="ig_id" value="{{ account.id }}">
              <button type="submit" class="account-button">
                <span class="avatar">{{ (account.username or account.id)[:1]|upper }}</span>
                <span>
                  <strong>@{{ account.username or account.id }}</strong>
                  <small>{{ account.id }}</small>
                </span>
              </button>
            </form>
          </li>
        {% endfor %}
      </ul>
    </section>
  </main>
</body>
</html>

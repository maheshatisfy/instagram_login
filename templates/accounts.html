<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap narrow">
    <h1>Choose an Instagram account</h1>
    <p class="muted">This login granted more than one Instagram professional account.</p>
    {% for ig_id in accounts %}
      <form method="post" action="{{ url_for('choose_account') }}">
        <input type="hidden" name="ig_id" value="{{ ig_id }}">
        <button type="submit">{{ ig_id }}</button>
      </form>
    {% endfor %}
  </main>
</body>
</html>

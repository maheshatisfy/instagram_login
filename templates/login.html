<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap narrow">
    <h1>Instagram API with Unified Login</h1>
    <p class="muted">Log in with Instagram or Facebook. The app then reads the professional account on graph.facebook.com.</p>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="error">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    <a class="button" href="{{ url_for('instagram_login') }}">Continue with Unified Login</a>
  </main>
</body>
</html>
